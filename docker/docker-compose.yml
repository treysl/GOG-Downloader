# NOTE: Docker support is no longer the primary distribution method.
# Use the portable Windows build instead — see README for instructions.

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - GOG_CLIENT_ID=${GOG_CLIENT_ID:-46899977096215655}
      - GOG_CLIENT_SECRET=${GOG_CLIENT_SECRET:-9d85c43b1482497dbbce61f6e4aa173a433796eeae2ca8c5f6129f2dc4de46d9}
      - REDIRECT_URI=${REDIRECT_URI:-http://localhost:8080/auth/callback}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:8080}
      - DOWNLOAD_PATH=/downloads
    volumes:
      - downloads:/downloads
    restart: unless-stopped

volumes:
  downloads:
